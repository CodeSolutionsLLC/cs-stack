name: Other
description: Product discussion that is not a bug or a docs change.
title: "Other: "
body:
  - type: markdown
    attributes:
      value: |
        Use this for product discussion that is not a bug report or a documentation change.

        **Do not include secrets, PATs, private config, or exploit writeups.**
        Report vulnerabilities privately — do not open a public issue.
        Email **security@codesolutionsllc.com**. See [SECURITY.md](https://github.com/CodeSolutionsLLC/cs-stack/blob/main/SECURITY.md).
  - type: textarea
    id: topic
    attributes:
      label: What is this about?
      description: The question or topic for maintainers.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Links or background that help the discussion. Redact secrets and private config.
    validations:
      required: false
