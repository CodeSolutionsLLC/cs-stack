name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-structure:
    name: Markdown structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Required paths exist
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            NOTICE
            SECURITY.md
            docs/PLAYBOOK-V0.md
            playbooks/README.md
            principles/README.md
            .github/CODEOWNERS
            .github/dependabot.yml
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "missing: $path"; exit 1; }
          done
          echo "Required paths present."

      - name: Markdown files are non-empty
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            if [[ ! -s "$f" ]]; then
              echo "empty markdown: $f"
              exit 1
            fi
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          echo "All markdown files non-empty."

      - name: Relative markdown links resolve
        run: |
          set -euo pipefail
          # Check [text](relative.md) and [text](path/to.md) style links
          fail=0
          while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            # Extract markdown links that are relative (not http/https/mailto/#)
            while IFS= read -r link; do
              [[ -z "$link" ]] && continue
              case "$link" in
                http://*|https://*|mailto:*|\#*) continue ;;
              esac
              # Strip fragment
              target="${link%%\#*}"
              [[ -z "$target" ]] && continue
              if [[ ! -e "$dir/$target" && ! -e "./$target" ]]; then
                echo "broken link in $f -> $link"
                fail=1
              fi
            done < <(grep -oE '\[[^]]*\]\([^)]+\)' "$f" | sed -E 's/^\[[^]]*\]\(([^)]+)\)$/\1/' || true)
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "Relative markdown links OK."

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        env:
          # rhysd/actionlint v1.7.12 linux/amd64 release tarball.
          # SHA256 is the linux_amd64 line in actionlint_1.7.12_checksums.txt
          # (same digest as the GitHub release asset).
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          version="${ACTIONLINT_VERSION}"
          expected="${ACTIONLINT_SHA256}"
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          checksums="actionlint_${version}_checksums.txt"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -fsSL -o "${tarball}" "${base}/${tarball}"
          curl -fsSL -o "${checksums}" "${base}/${checksums}"
          grep -qxF "${expected}  ${tarball}" "${checksums}"
          echo "${expected}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
          ./actionlint -version

      - name: Lint workflows
        run: ./actionlint -color .github/workflows/*.yml
